# 视觉重设计 v1（设计文档 v0.11）：把界面主题色换成产品已经在用的品牌蓝，
# 不再是 Streamlit 默认的橙红色——现在图表色板很讲究，按钮却对不上，先把这处对齐。
# 具体色值来源：engine/chart_spec.py 的 TITLE_COLOR 和 OPTION_COLOR_PALETTE。
#
# v0.12 加了第二个可选风格"极简"（app_streamlit/app.py 顶部有个主题切换下拉框），
# 但 Streamlit 原生控件（按钮/勾选框/下拉框）的颜色只能在这里配、只能在启动时定死一份，
# 没法跟着那个切换器实时换——这里保持"蓝调"这一份，是两个风格里定下来更早、更稳定
# 的默认值；"极简"风格切换时只会换页面里能用 CSS 够到的部分（背景/标题/卡片/字体），
# 原生控件仍然是蓝色的，这是已知的、说清楚了的局限，不是遗漏。
# v0.13：页面背景（"桌面"）跟每个板块的白色"纸张"卡片太接近了（#F7F8FA 和纯白
# 几乎看不出差别），真实反馈说卡片不够突出——加深页面背景，纸张和桌面的对比才明显。
[theme]
primaryColor = "#245785"
backgroundColor = "#E4E7EB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2733"
